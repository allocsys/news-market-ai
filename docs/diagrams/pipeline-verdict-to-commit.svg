<svg width="700" height="540" viewBox="0 0 700 540" xmlns="http://www.w3.org/2000/svg" role="img"><title>Pipeline stages: verdict through commit</title><desc>Debate verdict passed to a trader, then a deterministic risk check, then a deterministic portfolio check, ending in committing the thesis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:sans-serif;fill:#2c2c2a}.ts{font-size:12px}.th{font-size:14px;font-weight:600}.arr{stroke:#73726c;stroke-width:1;fill:none}.condarr{stroke:#73726c;stroke-width:1;fill:none;stroke-dasharray:4 3}</style><rect x="260" y="20" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central" fill="#444441">Verdict</text><text class="ts" x="340" y="58" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">From debate loop</text><line x1="340" y1="76" x2="340" y2="120" class="arr" marker-end="url(#arrow)"/><rect x="240" y="120" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Trader</text><text class="ts" x="340" y="158" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Turns verdict into a thesis</text><line x1="340" y1="176" x2="340" y2="220" class="arr" marker-end="url(#arrow)"/><rect x="230" y="220" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central" fill="#444441">Risk check</text><text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Sizing, stop-loss, take-profit</text><line x1="340" y1="276" x2="340" y2="320" class="arr" marker-end="url(#arrow)"/><rect x="220" y="320" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central" fill="#444441">Portfolio check</text><text class="ts" x="340" y="358" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Portfolio-wide go / no-go</text><line x1="340" y1="376" x2="340" y2="420" class="arr" marker-end="url(#arrow)"/><rect x="240" y="420" width="200" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text class="th" x="340" y="438" text-anchor="middle" dominant-baseline="central" fill="#27500A">Commit thesis</text><text class="ts" x="340" y="458" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">Plus reflection if replacing</text><line x1="440" y1="448" x2="468" y2="448" class="condarr" marker-end="url(#arrow)"/><rect x="470" y="420" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="575" y="438" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Reflection</text><text class="ts" x="575" y="458" text-anchor="middle" dominant-baseline="central" fill="#534AB7">On close/replace, quick model</text><rect x="40" y="500" width="14" height="14" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="ts" x="62" y="507" dominant-baseline="central" fill="#444441">LLM-backed</text><rect x="180" y="500" width="14" height="14" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts" x="202" y="507" dominant-baseline="central" fill="#444441">Deterministic</text><rect x="330" y="500" width="14" height="14" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text class="ts" x="352" y="507" dominant-baseline="central" fill="#27500A">Outcome</text><line x1="460" y1="507" x2="484" y2="507" class="condarr"/><text class="ts" x="492" y="507" dominant-baseline="central" fill="#444441">Conditional</text></svg>