<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img"><title>Pipeline stages: ingest through debate</title><desc>News item ingested, analyzed in parallel by three analysts, debated by bull and bear researchers, judged by a research manager who produces a verdict.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>text{font-family:sans-serif;fill:#2c2c2a}.ts{font-size:12px}.th{font-size:14px;font-weight:600}.arr{stroke:#73726c;stroke-width:1;fill:none}.condarr{stroke:#73726c;stroke-width:1;fill:none;stroke-dasharray:4 3}</style><rect x="460" y="15" width="200" height="50" rx="8" fill="none" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3"/><text class="th" x="560" y="33" text-anchor="middle" dominant-baseline="central" fill="#444441">Gate: trading/llm pause</text><text class="ts" x="560" y="53" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">llm-worker acks, skips run</text><line x1="460" y1="40" x2="442" y2="40" class="condarr" marker-end="url(#arrow)"/><rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="#444441">Ingest news item</text><line x1="340" y1="64" x2="340" y2="110" class="arr"/><path d="M340 110 L140 110 L140 140" class="arr" marker-end="url(#arrow)"/><path d="M340 110 L340 140" class="arr" marker-end="url(#arrow)"/><path d="M340 110 L540 110 L540 140" class="arr" marker-end="url(#arrow)"/><rect x="50" y="140" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="140" y="158" text-anchor="middle" dominant-baseline="central" fill="#3C3489">News event analyst</text><text class="ts" x="140" y="178" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Runs in parallel</text><rect x="250" y="140" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="340" y="158" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Sentiment analyst</text><text class="ts" x="340" y="178" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Runs in parallel</text><rect x="450" y="140" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="540" y="158" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Technical analyst</text><text class="ts" x="540" y="178" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Skipped if no price bars</text><line x1="140" y1="196" x2="140" y2="215" class="arr"/><line x1="340" y1="196" x2="340" y2="215" class="arr"/><line x1="540" y1="196" x2="540" y2="215" class="arr"/><line x1="140" y1="215" x2="540" y2="215" class="arr"/><line x1="340" y1="215" x2="340" y2="235" class="arr"/><path d="M340 235 L200 235 L200 260" class="arr" marker-end="url(#arrow)"/><path d="M340 235 L500 235 L500 260" class="arr" marker-end="url(#arrow)"/><rect x="70" y="260" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="200" y="278" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Bull researcher</text><text class="ts" x="200" y="298" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Makes the case to buy</text><rect x="370" y="260" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="500" y="278" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Bear researcher</text><text class="ts" x="500" y="298" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Makes the case to sell</text><path d="M200 316 L200 350 L340 350 L340 380" class="arr" marker-end="url(#arrow)"/><path d="M500 316 L500 350 L340 350 L340 380" class="arr" marker-end="url(#arrow)"/><rect x="210" y="380" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="340" y="398" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Research manager</text><text class="ts" x="340" y="418" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Judges debate, sets verdict</text><text class="ts" x="480" y="408" dominant-baseline="central" fill="#444441">&#8635; up to maxDebateRounds</text><rect x="40" y="460" width="14" height="14" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="ts" x="62" y="467" dominant-baseline="central" fill="#444441">LLM-backed step</text><rect x="220" y="460" width="14" height="14" rx="4" fill="none" stroke="#73726c" stroke-width="1" stroke-dasharray="3 2"/><text class="ts" x="242" y="467" dominant-baseline="central" fill="#444441">Pause gate</text></svg>