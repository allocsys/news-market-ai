# CI + deploy for this repo's single Cloudflare Worker.
#
# Pattern adapted from allocsys/ai-campaign-builder's deploy.yml (verified
# working there as of 2026-09-11), scaled DOWN to fit this repo: that repo
# is an npm-workspaces monorepo with five frontend apps + a backend, each
# gated behind its own dorny/paths-filter entry and a lockfile-sync job to
# keep a shared root package-lock.json in sync across workspaces. This repo
# is a single Worker with one package.json and no workspaces, so most of
# that machinery doesn't apply -- one test job, one migration job, one
# deploy job. What WAS brought back (2026-09-17): a single dorny/paths-filter
# job gating two things -- (a) skip test/migrate/deploy entirely on a
# docs-only diff (any markdown file, anywhere), (b) only run the migrate job
# when migrations/ itself changed, so an ordinary code-only push doesn't
# re-run (idempotent but pointless) remote D1 migrations. UPDATE (2026-09-17,
# later): the `code` filter started as an inclusion list (src/**, test/**,
# package.json, ...) that had to be hand-updated every time a new top-level
# directory was added, or a push into an unlisted path would silently sail
# through ungated as if it were docs-only. Flipped to exclusion-based --
# `**` minus any `*.md` -- so it's correct by construction for any future
# directory without a workflow-file edit; only markdown counts as docs now.
# workflow_dispatch has no
# base ref to diff against, so it bypasses the filter outright and always
# runs everything -- a manual trigger is an explicit ask to do the full job.
#
# What WAS carried over, because it solves a real problem this repo has too:
#   - The idempotent "look up by name, create only if missing, patch this
#     job's own uncommitted wrangler.toml checkout" pattern for KV
#     (.github/actions/ensure-kv-namespace) -- avoids requiring a manual
#     one-time `wrangler kv namespace create` before first deploy, and avoids
#     ever committing a real namespace id to the repo. (D1 used to ride the
#     same pattern; since M1/M5 every D1 binding carries a real id committed
#     directly and the D1 action was deleted -- see wrangler.toml.)
#   - Fail-fast secret-presence checks before touching Cloudflare, so a
#     misconfigured repo fails with a clear message instead of a confusing
#     wrangler error deep in a deploy step.
#   - GEMINI_API_KEYS (pushed by the `deploy-llm` job since plan.md Step 6, no
#     longer by the backend `deploy` job) pushed via `wrangler secret put` after a successful
#     deploy, same idempotent-on-repeat-run shape as ai-campaign-builder's
#     JWT_SECRET/VISION_*/B2_* secret-push steps.
#
# On pull_request: install + test only, as a CI gate -- no migrate, no deploy.
# On push to main / workflow_dispatch: install + test, then migrate (D1
# migrations apply, idempotent -- wrangler tracks which have already run),
# then deploy.
#
# migrate before deploy, not the other way around: deploying code that
# expects a column/table a pending migration hasn't created yet would break
# the Worker immediately on the next request.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-news-market-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs run. Filter definitions live in .github/path-filters.yml.
  #
  # WHY PER-TARGET BASELINES (2026-09-19): dorny/paths-filter on a push diffs
  # only against the PREVIOUS PUSH's head. If the run that first saw a change
  # was cancelled (concurrency cancel-in-progress) or failed (test job), the
  # next push's diff no longer contains that change, so no later run ever
  # deploys it. That silently left the dashboard Worker stale for weeks: run
  # #247 saw dashboard=true but its test job failed; run #249 diffed only
  # against #247's head and saw dashboard=false.
  #
  # Fix: for each target, find the newest earlier push/workflow_dispatch run
  # on main whose CORRESPONDING JOB concluded success (code->deploy,
  # migrations->migrate, dashboard->deploy-dashboard, ...) and diff against
  # that run's commit. A change stays "pending" for a target until a run
  # actually deploys it. Skipped/cancelled/failed jobs never advance a
  # baseline. FAILS OPEN: if no baseline can be resolved (API error, no
  # prior success, commit no longer in history) the target is treated as
  # changed, i.e. it deploys -- a redundant idempotent deploy is harmless, a
  # missed one is not.
  #
  # workflow_dispatch has no meaningful base ref to diff against -- skip the
  # filters entirely and force every output true, so a manual run always does
  # the full job. pull_request keeps the action's default base (merge-base
  # with the target branch); only code/migrations matter there.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.pr.outputs.code == 'true') || (github.event_name == 'push' && (steps.base.outputs.code == '' || steps.f_code.outputs.code == 'true')) }}
      migrations: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.pr.outputs.migrations == 'true') || (github.event_name == 'push' && (steps.base.outputs.migrations == '' || steps.f_migrations.outputs.migrations == 'true')) }}
      dashboard: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (steps.base.outputs.dashboard == '' || steps.f_dashboard.outputs.dashboard == 'true')) }}
      ingest: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (steps.base.outputs.ingest == '' || steps.f_ingest.outputs.ingest == 'true')) }}
      llm: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (steps.base.outputs.llm == '' || steps.f_llm.outputs.llm == 'true')) }}
      backtest: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (steps.base.outputs.backtest == '' || steps.f_backtest.outputs.backtest == 'true')) }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          # Full history: baselines can be many commits back.
          fetch-depth: 0
      - name: Resolve last-successful-deploy baseline per target
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deliberately no `set -e`: any failure here must fall through to
          # empty outputs (= deploy), never fail the workflow.
          set -u
          declare -A want=( [code]=deploy [migrations]=migrate [dashboard]=deploy-dashboard [ingest]=deploy-ingest [llm]=deploy-llm [backtest]=deploy-backtest )
          declare -A found=()
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&status=completed&per_page=50" \
            --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | "\(.id) \(.head_sha)"') || runs=""
          while read -r run_id sha; do
            [ -z "${run_id:-}" ] && continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            [ "${#found[@]}" -ge "${#want[@]}" ] && break
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=50" \
              --jq '.jobs[] | "\(.name) \(.conclusion)"') || continue
            for key in "${!want[@]}"; do
              [ -n "${found[$key]:-}" ] && continue
              if grep -qx "${want[$key]} success" <<<"$jobs"; then
                if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
                  found[$key]=$sha
                fi
              fi
            done
          done <<<"$runs"
          for key in "${!want[@]}"; do
            echo "${key}=${found[$key]:-}" >> "$GITHUB_OUTPUT"
            echo "baseline[${key}] (${want[$key]}) = ${found[$key]:-<none: will deploy>}"
          done

      # pull_request: default base, unchanged behavior.
      - uses: dorny/paths-filter@v3
        id: pr
        if: github.event_name == 'pull_request'
        with:
          filters: .github/path-filters.yml

      # push: one evaluation per target, each against its own baseline. Only
      # run when a baseline resolved; otherwise the output expression above
      # fails open to true.
      - uses: dorny/paths-filter@v3
        id: f_code
        if: github.event_name == 'push' && steps.base.outputs.code != ''
        with:
          base: ${{ steps.base.outputs.code }}
          filters: .github/path-filters.yml
      - uses: dorny/paths-filter@v3
        id: f_migrations
        if: github.event_name == 'push' && steps.base.outputs.migrations != ''
        with:
          base: ${{ steps.base.outputs.migrations }}
          filters: .github/path-filters.yml
      - uses: dorny/paths-filter@v3
        id: f_dashboard
        if: github.event_name == 'push' && steps.base.outputs.dashboard != ''
        with:
          base: ${{ steps.base.outputs.dashboard }}
          filters: .github/path-filters.yml
      - uses: dorny/paths-filter@v3
        id: f_ingest
        if: github.event_name == 'push' && steps.base.outputs.ingest != ''
        with:
          base: ${{ steps.base.outputs.ingest }}
          filters: .github/path-filters.yml
      - uses: dorny/paths-filter@v3
        id: f_llm
        if: github.event_name == 'push' && steps.base.outputs.llm != ''
        with:
          base: ${{ steps.base.outputs.llm }}
          filters: .github/path-filters.yml
      - uses: dorny/paths-filter@v3
        id: f_backtest
        if: github.event_name == 'push' && steps.base.outputs.backtest != ''
        with:
          base: ${{ steps.base.outputs.backtest }}
          filters: .github/path-filters.yml

  test:
    needs: changes
    # Skip entirely on a docs-only diff (e.g. a plan.md-only commit) -- no
    # code or migration changed, so there's nothing for CI to verify.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm test

  migrate:
    needs: [changes, test]
    # Only on an actual deploy trigger, and only when migrations/ itself
    # changed -- a code-only push has nothing new to apply, and re-running
    # is pointless even though wrangler's own migration tracking makes it
    # harmless. (test being skipped on a docs-only diff already skips this
    # job too via the implicit needs-skip, so this condition only matters
    # for the code-changed-but-no-migration case.)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.migrations == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Check required secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secret(s) -- cannot run D1 migrations. Aborting before touching the database."
            exit 1
          fi
      - name: Apply D1 migrations (remote)
        # db:migrate:remote:all covers the three environment-split D1
        # databases -- INPUTS_DB (migrations/inputs/), LIVE_DB
        # (migrations/state/), and SIM_DB (migrations/state/ +
        # migrations/sim/, two passes -- see wrangler.sim-migrate.toml). Their
        # real ids are committed in wrangler.toml, so no lookup/patch step is
        # needed before this one. (The pre-split legacy database was retired
        # in M5: nothing here migrates the root-level migrations/*.sql files
        # anymore.)
        # These three were previously migrated by hand only (see
        # wrangler.toml's own comment history); each `wrangler d1 migrations
        # apply` call is idempotent against already-applied migrations
        # (tracked per database in its own d1_migrations table, keyed by
        # filename), so this is a safe no-op today and only starts mattering
        # once M3+ adds new files under migrations/sim/ or migrations/state/.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote:all

  deploy:
    needs: [test, migrate]
    # always() needed because `migrate` is skipped on pull_request -- without
    # it, GitHub Actions' default "needs" behavior would skip this job too
    # instead of treating a skip as "nothing to wait on, proceed" (this job
    # itself is still gated to push/workflow_dispatch below, so a PR run
    # never reaches the deploy steps regardless).
    if: always() && needs.test.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Check required secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secret(s) -- aborting before attempting to deploy."
            exit 1
          fi
      - name: Ensure CACHE_KV namespace exists
        uses: ./.github/actions/ensure-kv-namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure BACKFILL queue exists (plan.md Step 3, renamed from JOBS in a Step 5 follow-up)
        # Renamed from news-market-ai-jobs when its consumer moved from
        # `backend` to the `ingest` Worker (2026-09-20) -- see wrangler.toml's
        # own comment on this queue and wrangler.ingest.toml's new consumer
        # block. The old JOBS queue (+ its DLQ) has no producer or consumer
        # left as of this change; ensure-queue only creates, never deletes,
        # so those two now-unused queue resources are left provisioned on
        # Cloudflare until the owner deletes them by hand (same
        # owner-deletes-cloud-resources-themselves precedent as the retired
        # pre-split D1 database, plan.md M5).
        uses: ./.github/actions/ensure-queue
        with:
          queue-name: news-market-ai-backfill
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure BACKFILL dead-letter queue exists (plan.md Step 3)
        uses: ./.github/actions/ensure-queue
        with:
          queue-name: news-market-ai-backfill-dlq
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure INGEST queue exists (plan.md Step 4)
        uses: ./.github/actions/ensure-queue
        with:
          queue-name: news-market-ai-ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure INGEST dead-letter queue exists (plan.md Step 4)
        uses: ./.github/actions/ensure-queue
        with:
          queue-name: news-market-ai-ingest-dlq
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure ANALYZE queue exists (plan.md Step 4)
        uses: ./.github/actions/ensure-queue
        with:
          queue-name: news-market-ai-analyze
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure ANALYZE dead-letter queue exists (plan.md Step 4)
        uses: ./.github/actions/ensure-queue
        with:
          queue-name: news-market-ai-analyze-dlq
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure LLM_JOBS queue exists (plan.md Step 6)
        uses: ./.github/actions/ensure-queue
        with:
          queue-name: news-market-ai-llm-jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure LLM_JOBS dead-letter queue exists (plan.md Step 6)
        uses: ./.github/actions/ensure-queue
        with:
          queue-name: news-market-ai-llm-jobs-dlq
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure BACKTEST queue exists (plan.md M3)
        # backend's wrangler.toml has a [[queues.producers]] BACKTEST binding to
        # this queue (POST /backtest/run), so `wrangler deploy` below fails if it
        # doesn't exist yet. The `backtest` Worker is its only consumer.
        uses: ./.github/actions/ensure-queue
        with:
          queue-name: news-market-ai-backtest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure BACKTEST dead-letter queue exists (plan.md M3)
        uses: ./.github/actions/ensure-queue
        with:
          queue-name: news-market-ai-backtest-dlq
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      # (No GEMINI_API_KEYS push here anymore -- plan.md Step 6 moved every
      # Gemini call into the `llm` Worker, so the `deploy-llm` job below is the
      # only job that ever sees that secret. A copy pushed to this Worker by an
      # earlier deploy still exists on Cloudflare until deleted; see
      # wrangler.toml's secrets comment and plan.md Step 7's secrets audit.)
      # (No FINNHUB_API_KEY push here anymore either, as of the Step 5
      # follow-up, 2026-09-20 -- backfill's Finnhub calls moved to the
      # `ingest` Worker along with the BACKFILL queue consumer, so this
      # Worker holds no vendor keys at all now. See wrangler.toml's own
      # secrets comment and deploy-ingest's FINNHUB_API_KEY step below,
      # which is now the only place this secret is pushed.)

  # `dashboard` Worker (plan.md Step 2) -- own path-filtered job, own
  # concurrency group (an unrelated backend-only push must never cancel an
  # in-flight dashboard deploy, and vice versa -- see plan.md's "CI/CD for
  # the 4-Worker split" section), own secrets. Depends on backend's own
  # `deploy` job (not just `test`/`migrate`) so the BACKEND service-binding
  # target exists before this Worker that binds to it is deployed --
  # matters most on a first-ever deploy of both.
  deploy-dashboard:
    needs: [changes, deploy]
    if: always() && needs.deploy.result == 'success' && needs.changes.outputs.dashboard == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-news-market-ai-dashboard-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Check required secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secret(s) -- aborting before attempting to deploy."
            exit 1
          fi
      - name: Deploy dashboard Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:dashboard
      - name: Set login secrets on the dashboard Worker
        # Unlike backend's now-removed equivalent step, these three are the
        # ONLY way the login can ever work -- dashboard has no "stays
        # unauthenticated" fallback (plan.md Step 2: an unconfigured login
        # fails closed, 503, everywhere). Same idempotent `wrangler secret
        # put` shape, scoped to this Worker's own wrangler config.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_TTL_SECONDS: ${{ secrets.SESSION_TTL_SECONDS }}
        run: |
          if [ -z "$DASHBOARD_USERNAME" ] || [ -z "$DASHBOARD_PASSWORD" ] || [ -z "$JWT_SECRET" ]; then
            echo "DASHBOARD_USERNAME/DASHBOARD_PASSWORD/JWT_SECRET not all set -- skipping. The dashboard Worker is deployed but every /dashboard/* route returns 503 (disabled) until all three are configured."
            exit 0
          fi
          echo "$DASHBOARD_USERNAME" | npx wrangler secret put DASHBOARD_USERNAME --config wrangler.dashboard.toml
          echo "$DASHBOARD_PASSWORD" | npx wrangler secret put DASHBOARD_PASSWORD --config wrangler.dashboard.toml
          echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --config wrangler.dashboard.toml
          if [ -n "$SESSION_TTL_SECONDS" ]; then
            echo "$SESSION_TTL_SECONDS" | npx wrangler secret put SESSION_TTL_SECONDS --config wrangler.dashboard.toml
          fi

  # `ingest` Worker (plan.md Step 5, extended by a Step 5 follow-up,
  # 2026-09-20) -- own path-filtered job, own concurrency group (same
  # reasoning as deploy-dashboard above: an unrelated push must never cancel
  # this Worker's in-flight deploy, and vice versa). Depends on backend's
  # own `deploy` job, not just `test`, since backend's deploy job is what
  # provisions the news-market-ai-ingest, news-market-ai-analyze, and (as of
  # the follow-up) news-market-ai-backfill queues (+ DLQs) this Worker's
  # wrangler.ingest.toml binds to (via the same ensure-queue composite
  # action, reused unmodified) -- matters most on a first-ever deploy of
  # both.
  deploy-ingest:
    needs: [changes, deploy]
    if: always() && needs.deploy.result == 'success' && needs.changes.outputs.ingest == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-news-market-ai-ingest-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Check required secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secret(s) -- aborting before attempting to deploy."
            exit 1
          fi
      - name: Ensure CACHE_KV namespace exists (patches wrangler.ingest.toml)
        # CACHE_KV is the only binding in this config still carrying a
        # placeholder id, and each job has its own checkout, so it has to be
        # resolved here (patching wrangler.toml in the backend job does nothing
        # for this file). Every D1 binding has a real id committed directly --
        # the legacy `DB` binding whose placeholder used to be resolved by a
        # sibling step here was removed in M5.
        uses: ./.github/actions/ensure-kv-namespace
        with:
          wrangler-config: wrangler.ingest.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy ingest Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:ingest
      - name: Set FINNHUB_API_KEY on the ingest Worker
        # Same idempotent, non-blocking shape as backend's own
        # FINNHUB_API_KEY step -- an unset key shouldn't block a first
        # deploy of everything else. Without it, finnhub.js's fetchLatest
        # logs a 401 VendorError per ticker and that source is skipped
        # (see pipeline.js's failure-isolation model) rather than anything
        # crashing. This Worker is now the ONLY holder of this secret,
        # for live ingestion (ingest_ticker/ingest_feeds) AND backfill (the
        # BACKFILL consumer, moved here from backend in the Step 5
        # follow-up, 2026-09-20) -- `backend` no longer holds a copy at all
        # (see wrangler.toml's own secrets comment).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "FINNHUB_API_KEY repo secret not set -- skipping. The ingest Worker is deployed but ingestion will fail (401, logged and skipped) until this is configured."
            exit 0
          fi
          echo "$FINNHUB_API_KEY" | npx wrangler secret put FINNHUB_API_KEY --config wrangler.ingest.toml
      - name: Set TIINGO_API_KEY on the ingest Worker
        # Same idempotent, non-blocking shape as the FINNHUB_API_KEY step above.
        # Tiingo is the historical price backfill's source (plan.md Next Steps
        # step A2): with the key set, config.js switches the backfill to Tiingo
        # by itself (PRICE_BACKFILL_SOURCE unset). Without it the ingest Worker
        # deploys fine and the price backfill keeps asking Yahoo, which answers
        # 429 from Workers. Only this Worker ever holds the key.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          if [ -z "$TIINGO_API_KEY" ]; then
            echo "TIINGO_API_KEY repo secret not set -- skipping. The ingest Worker is deployed but the historical price backfill keeps using Yahoo (429 from Workers) until this is configured."
            exit 0
          fi
          echo "$TIINGO_API_KEY" | npx wrangler secret put TIINGO_API_KEY --config wrangler.ingest.toml

  # `llm` Worker (plan.md Step 6) -- own path-filtered job, own concurrency
  # group (same reasoning as deploy-dashboard/deploy-ingest above: an
  # unrelated push must never cancel this Worker's in-flight deploy, and vice
  # versa), and one of two jobs that see GEMINI_API_KEYS (deploy-backtest is
  # the other). Depends on
  # backend's own `deploy` job, not just `test`, since backend's deploy job
  # is what provisions the news-market-ai-analyze / news-market-ai-llm-jobs
  # queues (+ DLQs) this Worker's wrangler.llm.toml consumes from (via the
  # same ensure-queue composite action, reused unmodified), and the KV
  # namespace it then resolves for itself below.
  deploy-llm:
    needs: [changes, deploy]
    if: always() && needs.deploy.result == 'success' && needs.changes.outputs.llm == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-news-market-ai-llm-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Check required secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secret(s) -- aborting before attempting to deploy."
            exit 1
          fi
      - name: Ensure CACHE_KV namespace exists (patches wrangler.llm.toml)
        uses: ./.github/actions/ensure-kv-namespace
        with:
          wrangler-config: wrangler.llm.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy llm Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:llm
      - name: Set GEMINI_API_KEYS on the llm Worker
        # Required for the pipeline to do anything useful (every LLM call
        # goes through src/llm/gemini/client.js's cascade), but pushing the
        # secret is still kept out of the fail-fast check above: a first
        # deploy that stands up the Worker/queues hasn't configured a Gemini
        # key yet should still succeed rather than blocking on infra that's
        # unrelated to whether a key is set. `wrangler secret put` is
        # idempotent against a repeat run with the same value, same as
        # ai-campaign-builder's equivalent steps. Moved here from backend's
        # deploy job (plan.md Step 6) -- this and deploy-backtest are now the
        # only jobs that touch GEMINI_API_KEYS.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          if [ -z "$GEMINI_API_KEYS" ]; then
            echo "GEMINI_API_KEYS repo secret not set -- skipping. The llm Worker is deployed but the Gemini cascade will fail until this is configured."
            exit 0
          fi
          echo "$GEMINI_API_KEYS" | npx wrangler secret put GEMINI_API_KEYS --config wrangler.llm.toml

  # `backtest` Worker (plan.md M3) -- own path-filtered job, own concurrency
  # group (same reasoning as deploy-llm above), and, like `llm`, holds
  # GEMINI_API_KEYS (its "on" side runs the real pipeline). It NEVER gets a
  # Finnhub key: a backtest reads only backfilled inputs. Depends on backend's
  # `deploy` job because that job provisions the news-market-ai-backtest queue
  # (+ DLQ) this Worker consumes. No ensure-d1/ensure-kv steps: unlike the
  # other Workers' configs, wrangler.backtest.toml carries real database/
  # namespace ids (test/ci_env_isolation.test.js pins that it never shares
  # live's), so there are no placeholders to resolve -- and an ensure step
  # would risk patching in live's ids.
  deploy-backtest:
    needs: [changes, deploy]
    if: always() && needs.deploy.result == 'success' && needs.changes.outputs.backtest == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-news-market-ai-backtest-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Check required secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secret(s) -- aborting before attempting to deploy."
            exit 1
          fi
      - name: Deploy backtest Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:backtest
      - name: Set GEMINI_API_KEYS on the backtest Worker
        # Same idempotent, non-blocking shape as deploy-llm's step: an unset
        # key shouldn't block standing the Worker up, but without it every
        # backtest LLM call fails until it is configured.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          if [ -z "$GEMINI_API_KEYS" ]; then
            echo "GEMINI_API_KEYS repo secret not set -- skipping. The backtest Worker is deployed but its Gemini calls will fail until this is configured."
            exit 0
          fi
          echo "$GEMINI_API_KEYS" | npx wrangler secret put GEMINI_API_KEYS --config wrangler.backtest.toml
