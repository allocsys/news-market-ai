name = "news-market-ai-llm"
main = "src/llm-worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Private, same "no public door" convention as backend's/ingest's wrangler
# configs (plan.md Step 2) -- this Worker has no meaningful HTTP surface, it
# only ever runs via its two queue consumers below.
workers_dev = false

# --- D1 (environment-split, plan.md "Backtest / Live Isolation" redesign,
# provisioned 2026-09-19, M1) --- this Worker is live-only, so it gets
# LIVE_DB (read/write) and INPUTS_DB (read-only by convention -- see
# readOnly(db) in src/storage/run_store.js). No SIM_DB: that's the future
# `backtest` Worker's (M3), and plan.md is explicit this Worker holds no
# binding to any other environment's state. Real ids committed directly --
# see wrangler.toml's own comment. runPipelineForTicker and
# checkOpenPositionExits read and write LIVE_DB (decisions, checkpoints,
# positions).
[[d1_databases]]
binding = "LIVE_DB"
database_name = "news-market-ai-live"
database_id = "215b7856-a888-41e1-b929-e9612e99ebd8"

[[d1_databases]]
binding = "INPUTS_DB"
database_name = "news-market-ai-inputs"
database_id = "c14d62d9-62bb-403f-8792-1c627e076d1a"

# --- KV --- same CACHE_KV namespace the other Workers bind. This Worker is
# the only one that reads/writes the Gemini cascade's cooldown state
# (`gemini:cooldown:<model>:<keyIndex>`, src/shared/cooldown.js) -- the
# keys are prefix-namespaced, so sharing the namespace with backend/ingest's
# own (unrelated) cache keys doesn't cause collisions. Free tier caps KV
# writes at 1K/day, so nothing high-frequency belongs in here.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# --- ANALYZE (consume) --- moved here from backend's wrangler.toml
# unchanged (plan.md Step 6): `ingest` (wrangler.ingest.toml) is now the
# only producer, `llm` the only consumer. `max_concurrency = 2` is the
# actual Gemini-call throttle plan.md Step 4 calls for -- each invocation's
# runPipelineForTicker makes several Gemini calls of its own -- a
# conservative starting point against the free-tier Gemini quota Adopted
# Pattern #7 budgets around, not tuned against real traffic yet.
[[queues.consumers]]
queue = "news-market-ai-analyze"
max_batch_size = 5
max_retries = 3
max_concurrency = 2
dead_letter_queue = "news-market-ai-analyze-dlq"

# --- LLM_JOBS (consume) --- NEW in Step 6. `backtest` and `exit_check`
# messages that used to ride JOBS (consumed by backend) moved here, since
# both call Gemini (see src/llm-worker.js's header). `backend` PRODUCES onto
# this queue via its own LLM_JOBS binding (POST /backtest/run, scheduled()).
# max_batch_size = 1: each `backtest` message is already one full signal-on/
# off run -- batching several together would just make one invocation more
# likely to hit its own CPU/wall-time limit for no benefit (same reasoning
# as JOBS's own block in backend's wrangler.toml). max_concurrency = 1: this
# queue's Gemini calls share the same keys/cooldown state as ANALYZE's
# above, so keep it from stacking a second full-speed consumer on top of
# ANALYZE's own concurrency of 2.
[[queues.consumers]]
queue = "news-market-ai-llm-jobs"
max_batch_size = 1
max_retries = 3
max_concurrency = 1
dead_letter_queue = "news-market-ai-llm-jobs-dlq"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[vars]
# Two-tier model strategy (plan.md Adopted Pattern #7): quick/cheap model for
# high-volume analyst passes, a stronger model reserved for debate + judge +
# trader, where reasoning quality actually matters. Moved here unchanged from
# backend's wrangler.toml (Step 6) -- this is now the only Worker that calls
# Gemini at all.
GEMINI_QUICK_MODEL = "gemini-3.1-flash-lite"
GEMINI_DEEP_MODEL = "gemini-3.6-flash"
# Tried in order AFTER the requested model; client.js drops whichever entry
# equals the requested model. Do NOT make this list just the quick model --
# that leaves quick-tier calls (most calls) with a single-model cascade and no
# fallback. UPDATE (2026-09-22): dropped gemini-2.5-flash -- Google retired it
# (404 "no longer available to new users" for every key, mid live backtest --
# a permanent failure, not a cooldown, so hitting it as the LAST model in the
# cascade killed the whole run instead of pausing; see client.js's 404
# handling). Resulting cascades (client.js drops whichever fallback entry
# equals the requested model, so each is one shorter than the raw list):
#   quick: 3.1-flash-lite -> 3.5-flash-lite -> 3.5-flash -> 3.7-flash -> 3.8-flash -> 3.6-flash -> 3-flash-preview   (7 models)
#   deep:  3.6-flash -> 3.1-flash-lite -> 3.5-flash-lite -> 3.5-flash -> 3.7-flash -> 3.8-flash -> 3-flash-preview   (7 models)
# UPDATE (2026-09-25): added gemini-3.5-flash -- it was the one stable Flash
# generation missing from the chain (had 3.5-flash-lite but not plain
# 3.5-flash, while every other generation's non-lite variant was present).
GEMINI_FALLBACK_MODELS = "gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-3.5-flash,gemini-3.7-flash,gemini-3.8-flash,gemini-3.6-flash,gemini-3-flash-preview"

# LLM call log (dashboard "LLM calls" page; src/storage/llm_calls.js). All
# optional -- defaults in src/config.js are on / 14 days / 60000 chars:
#   LLM_LOG_ENABLED        = "false" to stop logging prompts/responses to D1
#   LLM_LOG_RETENTION_DAYS = rows older than this are pruned each exit-check tick
#   LLM_LOG_MAX_CHARS      = each of prompt/response is clipped to this on write
# Each logged call costs ~4 D1 rows written (table + 3 indexes) against the
# free tier's 100K/day -- turn it off or shorten retention if that gets tight.

# Same watchlist as backend's/ingest's wrangler configs -- config.js's
# loadConfig reads it for every Worker, and keeping it here means anything
# in the pipeline that consults config.watchlist sees the same universe the
# rest of the system does. Keep in sync with backend's WATCHLIST_TICKERS if
# the watchlist ever changes -- there is no single shared source for this
# value across Workers, same as ingest/dashboard already don't share `vars`.
WATCHLIST_TICKERS = "AAPL,MSFT,TSLA,XAUUSD,USO"

# Secrets -- set via `wrangler secret put GEMINI_API_KEYS --config wrangler.llm.toml`,
# never committed:
#   GEMINI_API_KEYS = comma-separated list of Gemini API keys (cascade
#     rotates through all of them). Moved here from backend (Step 6) -- this
#     is the ONLY Worker that should hold it. Nothing else in the repo calls
#     Gemini: runPipelineForTicker (ANALYZE), runManualBacktest (`backtest`)
#     and checkOpenPositionExits -> settlePositionOutcome -> closeTheLoop
#     (`exit_check`) all run here, and runManualBacktest never touches
#     Finnhub (it only reads news already in D1), so this Worker needs no
#     vendor data key at all.
#   NOTE: `wrangler secret put` on THIS config does not remove the copy
#   backend already has on Cloudflare from before this step -- that stale
#   secret must be deleted from `news-market-ai` separately
#   (`wrangler secret delete GEMINI_API_KEYS`), see plan.md Step 7's secrets
#   audit.
