name = "news-market-ai-ingest"
main = "src/ingest-worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Private, same "no public door" convention as backend's wrangler.toml
# (plan.md Step 2) -- this Worker has no meaningful HTTP surface, it only
# ever runs via its INGEST queue consumer below.
workers_dev = false

# --- D1 (environment-split, plan.md "Backtest / Live Isolation" redesign,
# provisioned 2026-09-19, M1) --- ingest writes INPUTS_DB
# (news_items/news_item_revisions/news_item_tickers/price_bars/
# fundamental_facts, migrations/inputs/). No LIVE_DB/SIM_DB binding --
# ingest never touches run state. Real id committed directly -- see
# wrangler.toml's own comment. ingestTickerData/ingestFeedNews
# (src/graph/pipeline.js) write here via insertNewsItem/insertPriceBar/
# insertFundamentalFacts.
[[d1_databases]]
binding = "INPUTS_DB"
database_name = "news-market-ai-inputs"
database_id = "c14d62d9-62bb-403f-8792-1c627e076d1a"

# LIVE_DB (Step 5 follow-up, 2026-09-20): added ONLY so the new BACKFILL
# consumer below can report job progress the same way backend's old JOBS
# consumer did -- createJobReporter/RunStore(env.LIVE_DB, "live") write to
# job_progress (migrations/state/), the one state-schema table this Worker
# ever touches. This Worker still never reads or writes positions/
# trade_decisions/decision_memory/pipeline_checkpoints/llm_calls; nothing
# in ingest-worker.js's ingest_ticker/ingest_feeds branches uses this
# binding at all, only the backfill branch does. A D1 binding can't be
# scoped to one table, so this is a wider grant than the code strictly
# needs, same trust level `llm` already has -- flagged here rather than
# silently widened.
[[d1_databases]]
binding = "LIVE_DB"
database_name = "news-market-ai-live"
database_id = "215b7856-a888-41e1-b929-e9612e99ebd8"

# --- KV --- this Worker is now the ONLY one that touches the EDGAR CIK
# lookup cache (edgar_cik_lookup.js) and the entity-resolution SEC
# name-index cache (entity_resolution.js), plus Finnhub/yfinance's
# cross-invocation 429 cooldown (shared/cooldown.js) -- all of which ride
# this same CACHE_KV binding, same namespace `backend`/`dashboard` use.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# --- INGEST (consume) --- `backend`'s scheduled() (src/index.js) still
# PRODUCES onto this same queue via its own INGEST binding; this Worker is
# now the only consumer. Same max_batch_size/max_retries/DLQ as backend's
# former consumer block for this queue (moved, not changed) -- see
# wrangler.toml's own history/comments there for why those values were
# chosen (plan.md Step 4).
[[queues.consumers]]
queue = "news-market-ai-ingest"
max_batch_size = 10
max_retries = 3
dead_letter_queue = "news-market-ai-ingest-dlq"

# --- BACKFILL (consume, Step 5 follow-up, 2026-09-20) --- `backend`'s
# POST /backfill (src/index.js) PRODUCES onto this queue via its own
# BACKFILL binding (renamed from JOBS -- see wrangler.toml's own comment);
# this Worker is the only consumer. Moved here, not left on `backend`, so
# `backend` never needs FINNHUB_API_KEY at all -- backfillHistoricalNews
# calls Finnhub directly, same as ingest_ticker/ingest_feeds do. Same
# max_batch_size = 1 as the old JOBS consumer: one message is already the
# heavy, slow item this queue exists for (one full backfill), batching
# more together would just make one invocation more likely to hit its own
# CPU/wall-time limit for no benefit.
[[queues.consumers]]
queue = "news-market-ai-backfill"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "news-market-ai-backfill-dlq"

# --- BACKFILL (produce, 2026-09-20 follow-up to the follow-up) --- this
# Worker is now ALSO a producer on its own BACKFILL queue, not just the
# consumer above: a range too large to safely save in one invocation (see
# ingest-worker.js's MAX_ITEMS_PER_BACKFILL_INVOCATION) re-enqueues a
# continuation message for the SAME {id, from, to} onto this same queue,
# which this Worker's own consumer above then picks back up. `backend`'s
# POST /backfill still produces the FIRST message for a given id; this
# binding is only ever used for a Worker-initiated continuation of a job
# already in progress, never for a brand-new job.
[[queues.producers]]
queue = "news-market-ai-backfill"
binding = "BACKFILL"

# --- ANALYZE (produce) --- ingestTickerData/ingestFeedNews's callers
# (queue() below) enqueue one `analyze` message per resulting news item/
# ticker pair here, same as backend's former INGEST consumer did.
[[queues.producers]]
queue = "news-market-ai-analyze"
binding = "ANALYZE"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[vars]
# Same watchlist as backend's wrangler.toml -- used by entity resolution
# (rss.js/html_scrape.js's fetchLatest) to decide which tickers a
# non-ticker-hinted feed item might mention, and as the fallback ticker
# list for EDGAR fundamentals when edgarCikMap is empty (see config.js).
# Keep in sync with backend's WATCHLIST_TICKERS if the watchlist ever
# changes -- there is no single shared source for this value across
# Workers, same as dashboard/backend already don't share `vars` today.
WATCHLIST_TICKERS = "AAPL,MSFT,TSLA,XAUUSD,USO"

# SEC EDGAR requires a descriptive User-Agent identifying the requester
# (https://www.sec.gov/os/webmaster-faq#developers) -- not a secret, just an
# identifying string. Moved here from backend's wrangler.toml (Step 5) --
# this is now the only Worker that calls EDGAR at all.
EDGAR_USER_AGENT = "news-market-ai contact@allocsys.dev"

# Hardcoded CIK overrides for the current watchlist -- see backend's
# wrangler.toml's (now-removed) copy of this comment for the full "why" on
# skipping SEC's full company_tickers.json fetch/parse for a 3-ticker
# watchlist. Moved here unchanged (Step 5).
# Format: TICKER|CIK, comma-separated.
EDGAR_CIK_MAP = "AAPL|0000320193,MSFT|0000789019,TSLA|0001318605"

# Secrets -- set via `wrangler secret put FINNHUB_API_KEY --config wrangler.ingest.toml`,
# never committed:
#   FINNHUB_API_KEY -- moved here from backend's wrangler.toml (Step 5).
#   This Worker is now the ONLY one that calls Finnhub, for BOTH live
#   ingestion (ingest_ticker/ingest_feeds) AND backfill (the BACKFILL
#   consumer above, added in the Step 5 follow-up 2026-09-20 that closed
#   the gap this note used to describe -- `backend` no longer holds a
#   Finnhub key at all, see wrangler.toml's own secrets comment).
#   TIINGO_API_KEY -- the historical price backfill's source (plan.md Next
#   Steps step A2; src/ingestion/sources/tiingo.js). Optional: pushed by the
#   deploy-ingest job when the TIINGO_API_KEY repo secret exists. With it set,
#   src/config.js#priceBackfillSource defaults to "tiingo"; without it the
#   backfill still asks Yahoo, which answers 429 from Workers. Only this Worker
#   holds it.
