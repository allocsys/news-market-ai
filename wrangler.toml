name = "news-market-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Private (plan.md Step 2 -- "backend") -- no workers.dev URL, no [[routes]].
# The only caller that can reach this Worker at all is the `dashboard`
# Worker's BACKEND service binding (see wrangler.dashboard.toml), which
# already checked the session cookie before forwarding. This is what makes
# an unconfigured login fail closed rather than serve an open dashboard --
# there's no public door here regardless of app-level auth state.
workers_dev = false

# --- D1 (structured layer: news, analyst opinions, debates, decisions) ---
[[d1_databases]]
binding = "DB"
database_name = "news_market_ai"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# --- KV (lightweight config/flags + Finnhub's cross-invocation 429 cooldown
# for the `backfill` job -- see src/shared/cooldown.js. The Gemini cascade's
# cooldown keys are NOT written from this Worker anymore (plan.md Step 6:
# no Gemini calls originate here). Free tier caps writes at 1K/day, so
# nothing high-frequency belongs in here.) ---
[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# --- Queues (plan.md Step 3) --- POST /backfill validates + enqueues and
# returns immediately; the actual (slow, vendor-calling) work runs in this
# Worker's `queue()` consumer instead of inside `ctx.waitUntil` on the
# original request. This is the fix for the ~30-second cutoff
# `ctx.waitUntil` only guarantees past the response -- a queue consumer is
# its own separate invocation with its own wall-time budget, not a tail
# extension of a request that already returned.
# Since plan.md Step 6, JOBS carries `backfill` ONLY -- `backtest` and
# `exit_check` moved to the LLM_JOBS queue below (both call Gemini, which
# now lives exclusively in the `llm` Worker).
# max_batch_size = 1: each message here is already the heavy, slow item
# this queue exists for (one full backfill) -- batching several together
# would just make one consumer invocation more likely to hit its own
# CPU/wall-time limit for no benefit.
# dead_letter_queue only catches an unexpected crash in queue() itself (a
# genuine bug, e.g. a malformed message) -- ordinary business-logic
# failures (a vendor error mid-backfill) are caught inside queue(), logged
# (see src/index.js's queue() handler), then acked, not retried: retrying a
# call that already spent real Finnhub quota on failure would just spend it
# again for the same result.
[[queues.producers]]
queue = "news-market-ai-jobs"
binding = "JOBS"

[[queues.consumers]]
queue = "news-market-ai-jobs"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "news-market-ai-jobs-dlq"

# --- INGEST (produce only, plan.md Step 4, consumer moved to the new
# `ingest` Worker in Step 5) --- scheduled() no longer runs the pipeline
# inline; it enqueues one INGEST message per watchlist ticker plus one for
# the general feeds (src/index.js's `scheduled`). `backend` itself has NO
# consumer for this queue anymore -- see wrangler.ingest.toml, which is now
# the only Worker with a `[[queues.consumers]]` block for
# news-market-ai-ingest (a queue can only have one consumer). This turns
# one 15-minute cron tick's worth of work into many small invocations, each
# with its own fresh CPU/wall-time budget, instead of one large scheduled()
# invocation doing all of it (the free-tier CPU exhaustion Step 0 diagnosed).
[[queues.producers]]
queue = "news-market-ai-ingest"
binding = "INGEST"

# --- LLM_JOBS (produce only, plan.md Step 6) --- `backend` enqueues
# `backtest` (POST /backtest/run) and `exit_check` (scheduled()) here; the
# `llm` Worker (wrangler.llm.toml) is the only consumer. Both message types
# used to ride JOBS with this Worker as their consumer, but both call
# Gemini (backtest via the real pipeline over backfilled news, exit_check
# via a reflection per closed position), so they moved with the rest of the
# LLM work. No producer binding for ANALYZE is needed here anymore: the
# `ingest` Worker is its only producer (wrangler.ingest.toml), `llm` its
# only consumer -- `backend` neither produces nor consumes it after Step 6.
[[queues.producers]]
queue = "news-market-ai-llm-jobs"
binding = "LLM_JOBS"

# Ingestion cadence -- GDELT updates every 15 min, so no point polling faster.
[triggers]
crons = ["*/15 * * * *"]

# Workers Observability (logs) -- was missing entirely, unlike every other
# worker in this account, which made scheduled-run failures invisible (no
# way to see why ingestion/LLM stages were failing). head_sampling_rate=1
# logs every invocation; fine at this worker's request volume (one cron
# fire per 15 min, no public traffic).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[vars]
# GEMINI_QUICK_MODEL / GEMINI_DEEP_MODEL / GEMINI_FALLBACK_MODELS moved to
# wrangler.llm.toml (plan.md Step 6) -- this Worker no longer calls Gemini.

# Watchlist for GDELT ingestion (src/ingestion/sources/gdelt.js) -- one
# GDELT DOC API query per ticker, comma-separated. See src/config.js for
# why this is ticker-symbol-as-query for now (v1, deliberately blunt).
WATCHLIST_TICKERS = "AAPL,MSFT,TSLA"

# EDGAR_USER_AGENT / EDGAR_CIK_MAP moved to wrangler.ingest.toml (plan.md
# Step 5) -- this Worker no longer calls EDGAR directly (ingestTickerData/
# ingestFeedNews, the only callers, both moved to the new `ingest` Worker's
# queue() -- see src/ingest-worker.js). runScheduledIngestion (the older,
# unfanned-out whole-watchlist sweep in graph/pipeline.js) also calls EDGAR
# via ingestFundamentals, but nothing in this Worker's fetch/scheduled/queue
# handlers calls runScheduledIngestion -- it's kept unused/unwired, same
# status it already had before this step (see plan.md Step 4's own note on
# not touching that function).

# Secrets -- set via `wrangler secret put <NAME>`, never committed:
#   FINNHUB_API_KEY = STILL held here too (not just on wrangler.ingest.toml)
#     -- POST /backfill's JOBS `backfill` job (src/index.js's queue(),
#     plan.md Step 3) calls graph/pipeline.js#backfillHistoricalNews
#     directly, which hits Finnhub itself. This is a known, deliberate
#     partial exception to plan.md Step 5's "backend no longer holds
#     vendor keys" goal -- see that step's own plan.md section for why
#     moving backfill's consumer isn't in scope here (JOBS can only have
#     one consumer Worker; splitting it would be a larger redesign).
#   GEMINI_API_KEYS -- NO LONGER held here (moved to wrangler.llm.toml,
#     plan.md Step 6). deploy.yml no longer pushes it to this Worker, but a
#     copy set by an earlier deploy still exists on Cloudflare until it is
#     deleted (`wrangler secret delete GEMINI_API_KEYS`) -- nothing in this
#     Worker reads it anymore, so it's dead weight, not a live dependency.
#     Tracked for plan.md Step 7's secrets audit.
